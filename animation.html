<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.box{
    width: 200px;
    height: 200px;
    background-color: brown;
    position:absolute;
    animation-name: changeColor;
    animation-duration: 7s;
    


}
@keyframes changeColor{
    from{
        background-color: brown;
      border-radius: 7px;
    }
    to{
        background-color: aqua;
        border-radius: 100px;
        left: 30px;
        top: 45px;

    }
}





    </style>
</head>
<body>
    <div class="box">

    </div>
</body>
</html>
