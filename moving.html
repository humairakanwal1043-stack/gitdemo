<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: blue;
            position: relative;
            animation-name: myFirst;
            animation-duration: 5s;
            animation-delay: 2s;

        }

        @keyframes myFirst {
            0% {
                left: 0;
            }

            25% {
                left: 100px;
                background-color: aqua;
            }

            50% {
                top: 200px;
                left: 100px;
                background-color: black;
            }

            75% {
                top: 200px;
         
                right: 100px;
            }

            100% {
                left: 0;
            }

        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
