<head>
    <meta charset="UTF-8">

        .left{
            text-align:left ;

        }
        .right{
            text-align: right;
        }
        .center{
            text-align: center;
        }
        .justify{
            text-align:justify;
        }
        /* text decoration */
        h1{
            text-decoration: underline;
        }
        h2{
            text-decoration: overline;
        }
        h3{
            text-decoration:line-through;
        }
        a{
            text-decoration: none;
        }

        .indentation{
            text-indent: 50px;
        }
    </style></head>
<body>
<p>This is paragraph</p>
<h1>hello bunny</h1>
<!-- text align property -->
  <p class="left">left text</p>  
  <p class="right">right text</p>  
  <p class="center">center text</p>  
  <p class="justify">Justify text</p>
  
  <!-- text-decoration -->
  <h1>Underline text</h1>
  <h2>overline text</h2>
  <h3>Line through</h3>
  <a href="#">Google</a>

  <!-- text indent Property -->
