<!-- order in flexbox -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    .container{
        display: flex;
        gap:10px;
       width: 700px;
        
    }
    .item{
        background-color: rgb(1, 22, 22);
        color: aliceblue;
        padding: 20px;
    }
    .item1{
        order: 3;
      
    }
       .item3{
        order: 2;
        flex-grow: 3;
    }
       .item2{
        order: 1;
         flex-grow: 2;
        
    }
    </style>
 </head>
 <body>
     <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
       
    </div>
 </body>
 </html>
