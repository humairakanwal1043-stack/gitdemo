position ABSOLUTE -->



<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            width: 300px;
            height: 200px;
            background-color: aqua;
            border: 1px solid black;
            position:relative ;

        }
        .child{
            width: 80px;
            height:80px;
            background-color: rgb(195, 70, 70);
            border: 1px solid black;
            position: absolute;
            top: 20px;
            left:20px;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="child">

        </div>
    </div>
</body>

</html>
